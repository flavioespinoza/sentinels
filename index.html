<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Sentinels -- Flavio Espinoza</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Independent, read-only watchdogs over production systems." />
		<!-- Docsify serves the README and the _deep-dives pages as a site on GitHub Pages; nothing is built. -->
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/dark.css" />
		<style>
			:root {
				--theme-color: #f59e0b;
			}
			.markdown-section img {
				max-width: 420px;
			}
			/* Each sentinel: image on the left, text on the right. */
			.sentinel-row {
				display: flex;
				gap: 1.5rem;
				align-items: flex-start;
				margin-bottom: 2rem;
			}
			.sentinel-media {
				flex: 0 0 auto;
				width: 220px;
			}
			.sentinel-media-wide {
				width: 300px;
			}
			.markdown-section .sentinel-media img,
			.markdown-section .sentinel-media video {
				display: block;
				width: 100%;
				max-width: none;
				height: auto;
				border-radius: 6px;
			}
			.markdown-section .sentinel-media video {
				margin-top: 0.75rem;
			}
			.markdown-section .sentinel-caption {
				margin: 0.5rem 0 0;
				font-size: 0.85em;
			}
			.sentinel-text {
				flex: 1;
				min-width: 0;
			}
			.markdown-section .sentinel-text > :first-child {
				margin-top: 0;
			}
			/* The language rides beside the title as a small badge. */
			.markdown-section h1 code {
				font-size: 0.45em;
				font-weight: normal;
				vertical-align: middle;
				white-space: nowrap;
			}
			/* A finished sentinel: opening frame, text, last frame. */
			.sentinel-row-3 .sentinel-media {
				flex: 0 0 240px;
				width: 240px;
			}
			@media (max-width: 900px) {
				.sentinel-row-3 {
					flex-wrap: wrap;
				}
				.sentinel-row-3 .sentinel-text {
					flex: 1 1 100%;
					order: 1;
				}
			}
			@media (max-width: 640px) {
				.sentinel-row {
					flex-direction: column;
				}
				.sentinel-media,
				.sentinel-media-wide {
					width: 100%;
					max-width: 320px;
				}
				.sentinel-row-3 {
					flex-wrap: nowrap;
				}
				.sentinel-row-3 .sentinel-media {
					flex: 0 0 auto;
					width: 100%;
					max-width: 320px;
				}
				.sentinel-row-3 .sentinel-text {
					flex: 0 0 auto;
					width: 100%;
					order: 0;
				}
			}
		</style>
	</head>
	<body>
		<div id="app">Loading the sentinels…</div>
		<script>
			window.$docsify = {
				name: "Sentinels",
				repo: "flavioespinoza/sentinels",
				loadSidebar: true,
				subMaxLevel: 0,
				relativePath: true,
				auto2top: true,
				homepage: "README.md",
				// relativePath reads a sidebar per folder; every folder uses the one at the root.
				alias: { "/.*/_sidebar.md": "/_sidebar.md" },
				search: { placeholder: "Search the sentinels", noData: "No match" },
			};
		</script>
		<script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
		<script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
	</body>
</html>
